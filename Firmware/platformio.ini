; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.filesystem = littlefs
; Web pages in web/ are built into the firmware (see scripts/embed_web.py).
; The filesystem only holds the settings the device saves, so firmware
; updates (including OTA) keep them.
extra_scripts = pre:scripts/embed_web.py
; Serial logging is off because GPIO1/GPIO3 (TX/RX) drive the DHT and bay 2
; sensor. To debug over serial, uncomment this (those sensors won't work).
;build_flags = -D SERIAL_LOGGING
monitor_speed = 9600
monitor_rts = 0
monitor_dtr = 0
lib_deps =
	ericksimoes/Ultrasonic @ 3.0.0
	adafruit/DHT sensor library @ 1.4.6
	adafruit/Adafruit Unified Sensor @ 1.1.14
	knolleary/PubSubClient @ 2.8.0
	bblanchon/ArduinoJson @ 7.0.2
	thijse/ArduinoLog @ 1.1.1
